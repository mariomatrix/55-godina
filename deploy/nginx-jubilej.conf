# ==============================================================================
# Nginx konfiguracija za jubilej.fgag.eu i 55godina.fgag.eu
# Postavljanje: /etc/nginx/sites-available/jubilej.fgag.eu
# Aktivacija:  ln -s /etc/nginx/sites-available/jubilej.fgag.eu /etc/nginx/sites-enabled/
# Test:        nginx -t && systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name jubilej.fgag.eu 55godina.fgag.eu;

    # Ako koristite Cloudflare SSL (Flexible/Full), možete ostaviti port 80
    # ili dodati certbot: certbot --nginx -d jubilej.fgag.eu -d 55godina.fgag.eu

    access_log /var/log/nginx/jubilej_fgag_access.log;
    error_log /var/log/nginx/jubilej_fgag_error.log;

    # Opcija A (Preporučeno): Reverse proxy na samostalni Node.js proces
    location / {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Zaštita od pristupa skrivenim datotekama (.git, .env, itd.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
